services:
  mysql:
    image: mysql:8.4
    container_name: karwan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uecommerce", "-pecommerce"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Hostinger Docker Manager can pull public Docker Hub images, but GHCR often stays private.
  # So we run the official JRE image and download the release JAR on start.
  app:
    image: eclipse-temurin:21-jre-jammy
    container_name: karwan-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      APP_JWT_SECRET: change-me-to-a-long-random-secret-at-least-32-chars
      SERVER_PORT: 8080
      JAR_URL: https://github.com/doctorx8/ecommerce/releases/latest/download/karwan-store.jar
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq curl ca-certificates
        echo "Downloading app jar..."
        curl -fsSL "$${JAR_URL}" -o /tmp/karwan-store.jar
        exec java -jar /tmp/karwan-store.jar

volumes:
  mysql_data:
