server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: karwan-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce}
    password: ${SPRING_DATASOURCE_PASSWORD:ecommerce}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  store:
    name: ${APP_STORE_NAME:Karwan}
    public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  shipping:
    flat-rate: ${APP_SHIPPING_FLAT_RATE:9.99}
    free-threshold: ${APP_SHIPPING_FREE_THRESHOLD:100}
  tax:
    rate: ${APP_TAX_RATE:0.08}
  mail:
    from: ${APP_MAIL_FROM:noreply@karwan.local}
    enabled: ${APP_MAIL_ENABLED:true}
  payment:
    provider: mock

logging:
  level:
    com.ecommerce.store: INFO
